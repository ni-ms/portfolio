<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" role="img" aria-label="FastCode CPU Kernel Vector Optimization Architecture">
  <defs>
    <linearGradient id="fastcodeGradDark" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141919" />
      <stop offset="100%" stop-color="#101414" />
    </linearGradient>
    <linearGradient id="limeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6FF64" />
      <stop offset="100%" stop-color="#BEE84B" />
    </linearGradient>
    <linearGradient id="regBlock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212a2b" />
      <stop offset="100%" stop-color="#171e1f" />
    </linearGradient>
  </defs>

  <style>
    .bg-panel { fill: url(#fastcodeGradDark); stroke: #232C2D; }
    .grid-line { stroke: #232C2D; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .card-box { fill: #171E1F; stroke: #2E3A3C; }
    .sub-box { fill: #1E2728; stroke: #364446; }
    .header-text { fill: #F2F1EA; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; }
    .label-text { fill: #A5ABAA; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
    .accent-text { fill: #D6FF64; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .accent-line { stroke: #D6FF64; stroke-width: 2; }
    .muted-line { stroke: #565F60; stroke-width: 1.5; }

    @media (prefers-color-scheme: light) {
      .bg-panel { fill: #EBECE5; stroke: #C8CDC4; }
      .grid-line { stroke: #D2D6CE; }
      .card-box { fill: #FFFFFF; stroke: #C8CDC4; }
      .sub-box { fill: #F2F1EA; stroke: #C8CDC4; }
      .header-text { fill: #101414; }
      .label-text { fill: #454F50; }
      .accent-text { fill: #101414; }
      .accent-line { stroke: #101414; }
      .muted-line { stroke: #8E9596; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="600" height="340" rx="8" class="bg-panel" stroke-width="1.5" />

  <!-- Technical Blueprint Grid Lines -->
  <g class="grid-line">
    <line x1="30" y1="60" x2="570" y2="60" />
    <line x1="30" y1="180" x2="570" y2="180" />
    <line x1="195" y1="30" x2="195" y2="310" />
    <line x1="395" y1="30" x2="395" y2="310" />
  </g>

  <!-- Top Title / Badge -->
  <g transform="translate(30, 24)">
    <rect width="180" height="24" rx="4" class="card-box" />
    <circle cx="14" cy="12" r="4" fill="#D6FF64" />
    <text x="26" y="16" class="accent-text" font-size="10" letter-spacing="0.08em">CPU KERNEL ARCHITECTURE</text>
  </g>
  <text x="570" y="40" class="label-text" text-anchor="end">YOLOv8n FP32 1x1 CONVOLUTION</text>

  <!-- Column 1: Input Packing (Left) -->
  <g transform="translate(30, 75)">
    <rect width="145" height="185" rx="6" class="card-box" />
    <text x="14" y="26" class="header-text" font-size="12">INPUT PACKING</text>
    <text x="14" y="42" class="label-text">Memory Stride Layout</text>

    <rect x="14" y="56" width="117" height="30" rx="3" class="sub-box" />
    <text x="22" y="75" class="label-text">Input Tensor [N, C, H, W]</text>

    <path d="M72 86 V100" class="accent-line" stroke-dasharray="3 3" />

    <rect x="14" y="102" width="117" height="34" rx="3" class="sub-box" />
    <text x="22" y="118" class="label-text">Continuous Buffer</text>
    <text x="22" y="130" class="label-text" font-size="9">Cache-Aware Stride</text>

    <rect x="14" y="144" width="117" height="26" rx="3" fill="#D6FF64" opacity="0.15" stroke="#D6FF64" />
    <text x="22" y="161" class="accent-text" font-size="9">L1/L2 Spatial Locality</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M175 167 H215" class="accent-line" stroke-dasharray="4 3" />
  <polygon points="215,167 208,163 208,171" fill="#D6FF64" />

  <!-- Column 2: Vectorization & Register Blocking (Center) -->
  <g transform="translate(225, 75)">
    <rect width="150" height="185" rx="6" class="card-box" />
    <text x="14" y="26" class="header-text" font-size="12">REGISTER BLOCKING</text>
    <text x="14" y="42" class="label-text">SIMD Vector Pipelines</text>

    <!-- Vector registers matrix visualization -->
    <g transform="translate(14, 56)">
      <rect width="122" height="22" rx="3" class="sub-box" />
      <text x="12" y="15" class="label-text">ymm0 – ymm7 (Weights)</text>
    </g>

    <g transform="translate(14, 84)">
      <rect width="122" height="22" rx="3" class="sub-box" />
      <text x="12" y="15" class="label-text">ymm8 – ymm15 (Inputs)</text>
    </g>

    <!-- FMA Operation Unit -->
    <g transform="translate(14, 114)">
      <rect width="122" height="48" rx="3" class="sub-box" stroke-width="1.5" />
      <text x="12" y="20" class="accent-text" font-size="10">AVX2 / FMA KERNEL</text>
      <text x="12" y="36" class="label-text" font-size="9">Fused Multiply-Add</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M375 167 H415" class="accent-line" stroke-dasharray="4 3" />
  <polygon points="415,167 408,163 408,171" fill="#D6FF64" />

  <!-- Column 3: Primary Workload Benchmark Outcome (Right) -->
  <g transform="translate(425, 75)">
    <rect width="145" height="185" rx="6" class="card-box" />
    <text x="14" y="26" class="header-text" font-size="12">BENCHMARK</text>
    <text x="14" y="42" class="label-text">Execution Latency</text>

    <!-- Reference bar -->
    <text x="14" y="70" class="label-text">OpenCV: 684 µs</text>
    <rect x="14" y="76" width="117" height="14" rx="2" class="sub-box" />

    <!-- FastCode bar -->
    <text x="14" y="108" class="accent-text" font-size="10">FastCode: 539 µs</text>
    <rect x="14" y="114" width="92" height="14" rx="2" fill="url(#limeBar)" />

    <!-- Metric Callout -->
    <g transform="translate(14, 138)">
      <rect width="117" height="28" rx="3" class="sub-box" />
      <text x="8" y="18" class="accent-text" font-size="10">▼ 21% · ~91% PEAK</text>
    </g>
  </g>

  <!-- Footer Legend -->
  <text x="30" y="300" class="label-text">Primary Workload Benchmark · AVX2/FMA Vectorization</text>
  <text x="570" y="300" class="label-text" text-anchor="end">C++ Kernel Optimization</text>
</svg>
