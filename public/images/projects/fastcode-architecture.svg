<svg viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .chip-sub { fill: #171d1e; stroke: #2a3536; }
      .chip-die { fill: #101414; stroke: #3d4c4e; }
      .core-block { fill: #1c2425; stroke: #2f3b3d; }
      .reg-block { fill: #222c2d; stroke: #3f4e50; }
      .simd-active { fill: #D6FF64; fill-opacity: 0.9; }
      .simd-idle { fill: #3a4749; }
      .bus-wire { stroke: #455456; stroke-dasharray: 4 3; }
      .accent-wire { stroke: #D6FF64; stroke-width: 2; }
      .pin { fill: #8a9688; stroke: #5a6658; }
      .pin-active { fill: #D6FF64; }
      @media (prefers-color-scheme: light) {
        .chip-sub { fill: #e2e4dc; stroke: #c4c8bc; }
        .chip-die { fill: #ebece4; stroke: #b6baa8; }
        .core-block { fill: #dadfd2; stroke: #c2c7b8; }
        .reg-block { fill: #cdd2c4; stroke: #b4baa8; }
        .simd-active { fill: #D6FF64; stroke: #101414; stroke-width: 1; fill-opacity: 1; }
        .simd-idle { fill: #b8bea8; }
        .bus-wire { stroke: #9ca38e; }
        .accent-wire { stroke: #101414; stroke-width: 2; }
        .pin { fill: #a4ab96; stroke: #8c947e; }
        .pin-active { fill: #D6FF64; stroke: #101414; stroke-width: 1; }
      }
    </style>
    <linearGradient id="dieGlow" x1="0" y1="0" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6FF64" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#D6FF64" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  {/* Outer Package Substrate */}
  <rect x="70" y="30" width="460" height="300" rx="16" class="chip-sub" stroke-width="2" />
  <rect x="70" y="30" width="460" height="300" rx="16" fill="url(#dieGlow)" />

  {/* Outer Package Pins (Top and Bottom) */}
  <g class="pins">
    <rect x="110" y="18" width="12" height="12" rx="2" class="pin" />
    <rect x="140" y="18" width="12" height="12" rx="2" class="pin" />
    <rect x="170" y="18" width="12" height="12" rx="2" class="pin-active" />
    <rect x="200" y="18" width="12" height="12" rx="2" class="pin" />
    <rect x="230" y="18" width="12" height="12" rx="2" class="pin-active" />
    <rect x="260" y="18" width="12" height="12" rx="2" class="pin" />
    <rect x="290" y="18" width="12" height="12" rx="2" class="pin-active" />
    <rect x="320" y="18" width="12" height="12" rx="2" class="pin" />
    <rect x="350" y="18" width="12" height="12" rx="2" class="pin-active" />
    <rect x="380" y="18" width="12" height="12" rx="2" class="pin" />
    <rect x="410" y="18" width="12" height="12" rx="2" class="pin" />
    <rect x="440" y="18" width="12" height="12" rx="2" class="pin-active" />
    <rect x="470" y="18" width="12" height="12" rx="2" class="pin" />

    <rect x="110" y="330" width="12" height="12" rx="2" class="pin" />
    <rect x="140" y="330" width="12" height="12" rx="2" class="pin-active" />
    <rect x="170" y="330" width="12" height="12" rx="2" class="pin" />
    <rect x="200" y="330" width="12" height="12" rx="2" class="pin" />
    <rect x="230" y="330" width="12" height="12" rx="2" class="pin-active" />
    <rect x="260" y="330" width="12" height="12" rx="2" class="pin" />
    <rect x="290" y="330" width="12" height="12" rx="2" class="pin" />
    <rect x="320" y="330" width="12" height="12" rx="2" class="pin-active" />
    <rect x="350" y="330" width="12" height="12" rx="2" class="pin" />
    <rect x="380" y="330" width="12" height="12" rx="2" class="pin-active" />
    <rect x="410" y="330" width="12" height="12" rx="2" class="pin" />
    <rect x="440" y="330" width="12" height="12" rx="2" class="pin" />
    <rect x="470" y="330" width="12" height="12" rx="2" class="pin-active" />

    {/* Side Pins */}
    <rect x="58" y="70" width="12" height="12" rx="2" class="pin" />
    <rect x="58" y="110" width="12" height="12" rx="2" class="pin-active" />
    <rect x="58" y="150" width="12" height="12" rx="2" class="pin" />
    <rect x="58" y="190" width="12" height="12" rx="2" class="pin-active" />
    <rect x="58" y="230" width="12" height="12" rx="2" class="pin" />
    <rect x="58" y="270" width="12" height="12" rx="2" class="pin" />

    <rect x="530" y="70" width="12" height="12" rx="2" class="pin-active" />
    <rect x="530" y="110" width="12" height="12" rx="2" class="pin" />
    <rect x="530" y="150" width="12" height="12" rx="2" class="pin-active" />
    <rect x="530" y="190" width="12" height="12" rx="2" class="pin" />
    <rect x="530" y="230" width="12" height="12" rx="2" class="pin-active" />
    <rect x="530" y="270" width="12" height="12" rx="2" class="pin" />
  </g>

  {/* Central Silicon Die */}
  <rect x="120" y="60" width="360" height="240" rx="8" class="chip-die" stroke-width="2" />

  {/* Internal Microarchitecture Die Partitioning */}
  {/* Left: Input Cache / Memory Hierarchy Array */}
  <rect x="140" y="80" width="90" height="200" rx="6" class="core-block" stroke-width="1.5" />
  <g class="cache-lines">
    <rect x="150" y="94" width="70" height="18" rx="2" class="reg-block" />
    <rect x="150" y="120" width="70" height="18" rx="2" class="reg-block" />
    <rect x="150" y="146" width="70" height="18" rx="2" class="reg-block" />
    <rect x="150" y="172" width="70" height="18" rx="2" class="reg-block" />
    <rect x="150" y="198" width="70" height="18" rx="2" class="reg-block" />
    <rect x="150" y="224" width="70" height="18" rx="2" class="reg-block" />
    <rect x="150" y="250" width="70" height="18" rx="2" class="reg-block" />
  </g>

  {/* Bus Interconnect from Cache to Vector Compute */}
  <path d="M 230 110 L 260 110" class="accent-wire" />
  <path d="M 230 150 L 260 150" class="bus-wire" stroke-width="1.5" />
  <path d="M 230 190 L 260 190" class="accent-wire" />
  <path d="M 230 230 L 260 230" class="bus-wire" stroke-width="1.5" />
  <path d="M 230 270 L 260 270" class="accent-wire" />

  {/* Center: Vector SIMD Compute Engine (Grid of 4x6 execution units) */}
  <rect x="260" y="80" width="180" height="200" rx="6" class="core-block" stroke-width="1.5" />

  {/* Vector execution lanes */}
  <g class="simd-matrix">
    {/* Row 1 */}
    <rect x="275" y="96" width="32" height="20" rx="3" class="simd-active" />
    <rect x="315" y="96" width="32" height="20" rx="3" class="simd-active" />
    <rect x="355" y="96" width="32" height="20" rx="3" class="simd-idle" />
    <rect x="395" y="96" width="32" height="20" rx="3" class="simd-active" />

    {/* Row 2 */}
    <rect x="275" y="124" width="32" height="20" rx="3" class="simd-active" />
    <rect x="315" y="124" width="32" height="20" rx="3" class="simd-active" />
    <rect x="355" y="124" width="32" height="20" rx="3" class="simd-active" />
    <rect x="395" y="124" width="32" height="20" rx="3" class="simd-idle" />

    {/* Row 3 */}
    <rect x="275" y="152" width="32" height="20" rx="3" class="simd-idle" />
    <rect x="315" y="152" width="32" height="20" rx="3" class="simd-active" />
    <rect x="355" y="152" width="32" height="20" rx="3" class="simd-active" />
    <rect x="395" y="152" width="32" height="20" rx="3" class="simd-active" />

    {/* Row 4 */}
    <rect x="275" y="180" width="32" height="20" rx="3" class="simd-active" />
    <rect x="315" y="180" width="32" height="20" rx="3" class="simd-active" />
    <rect x="355" y="180" width="32" height="20" rx="3" class="simd-idle" />
    <rect x="395" y="180" width="32" height="20" rx="3" class="simd-active" />

    {/* Row 5 */}
    <rect x="275" y="208" width="32" height="20" rx="3" class="simd-active" />
    <rect x="315" y="208" width="32" height="20" rx="3" class="simd-idle" />
    <rect x="355" y="208" width="32" height="20" rx="3" class="simd-active" />
    <rect x="395" y="208" width="32" height="20" rx="3" class="simd-active" />

    {/* Row 6 */}
    <rect x="275" y="236" width="32" height="20" rx="3" class="simd-active" />
    <rect x="315" y="236" width="32" height="20" rx="3" class="simd-active" />
    <rect x="355" y="236" width="32" height="20" rx="3" class="simd-active" />
    <rect x="395" y="236" width="32" height="20" rx="3" class="simd-active" />
  </g>

  {/* Output Bus Lines */}
  <path d="M 440 130 L 460 130" class="accent-wire" />
  <path d="M 440 180 L 460 180" class="accent-wire" />
  <path d="M 440 230 L 460 230" class="accent-wire" />

  {/* Corner Alignment Markers on Die */}
  <circle cx="132" cy="72" r="3" fill="#D6FF64" opacity="0.8" />
  <circle cx="468" cy="72" r="3" class="pin" />
  <circle cx="132" cy="288" r="3" class="pin" />
  <circle cx="468" cy="288" r="3" fill="#D6FF64" opacity="0.8" />
</svg>
