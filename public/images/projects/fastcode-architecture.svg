<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" role="img" aria-label="FastCode CPU Kernel Architecture Diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#141919" />
      <stop offset="100%" stopColor="#101414" />
    </linearGradient>
    <linearGradient id="regGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1f2829" />
      <stop offset="100%" stopColor="#161c1d" />
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#D6FF64" />
      <stop offset="100%" stopColor="#b4e63b" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="340" rx="8" fill="url(#bgGrad)" stroke="#232C2D" stroke-width="1.5" />

  <!-- Grid Blueprint lines -->
  <g stroke="#232C2D" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="30" y1="60" x2="570" y2="60" />
    <line x1="30" y1="170" x2="570" y2="170" />
    <line x1="30" y1="270" x2="570" y2="270" />
    <line x1="200" y1="30" x2="200" y2="310" />
    <line x1="400" y1="30" x2="400" y2="310" />
  </g>

  <!-- Header / Badge -->
  <rect x="30" y="24" width="170" height="24" rx="4" fill="#1b2223" stroke="#2e3a3c" />
  <circle cx="44" cy="36" r="4" fill="#D6FF64" />
  <text x="56" y="40" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.08em">CPU KERNEL / AVX2</text>

  <text x="440" y="40" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">YOLOv8n 1x1 CONV</text>

  <!-- Section 1: Input & Packing (Left Block) -->
  <g transform="translate(30, 75)">
    <rect width="150" height="180" rx="6" fill="#161c1d" stroke="#2e3a3c" />
    <text x="16" y="26" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">INPUT PACKING</text>
    <text x="16" y="42" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="10">Cache-Aware Stride</text>

    <!-- Buffer Blocks -->
    <rect x="16" y="56" width="118" height="24" rx="3" fill="#1f2829" stroke="#364446" />
    <text x="24" y="72" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="10">L1 Data Cache</text>
    
    <rect x="16" y="86" width="118" height="24" rx="3" fill="#1f2829" stroke="#364446" />
    <text x="24" y="102" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="10">Channel Re-order</text>

    <rect x="16" y="116" width="118" height="42" rx="3" fill="#242e30" stroke="#3d4e50" />
    <text x="24" y="133" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Continuous Memory</text>
    <text x="24" y="147" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Stride: 32-Byte Aligned</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M180 165 H215" stroke="#D6FF64" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="215,165 210,161 210,169" fill="#D6FF64" />

  <!-- Section 2: AVX2/FMA Vector Registers (Middle Block) -->
  <g transform="translate(225, 75)">
    <rect width="155" height="180" rx="6" fill="#161c1d" stroke="#2e3a3c" />
    <text x="16" y="26" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">REGISTER BLOCK</text>
    <text x="16" y="42" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="10">ymm0 – ymm15 (256-bit)</text>

    <!-- Vector Lane Rows -->
    <g transform="translate(16, 56)">
      <rect width="123" height="22" rx="3" fill="#1b2324" stroke="#2e3b3d" />
      <rect x="2" y="2" width="28" height="18" rx="2" fill="#263335" />
      <rect x="33" y="2" width="28" height="18" rx="2" fill="#263335" />
      <rect x="64" y="2" width="28" height="18" rx="2" fill="#263335" />
      <rect x="95" y="2" width="26" height="18" rx="2" fill="#D6FF64" opacity="0.3" />
      <text x="10" y="15" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="9">8x FP32 LANES</text>
    </g>

    <g transform="translate(16, 84)">
      <rect width="123" height="22" rx="3" fill="#1b2324" stroke="#2e3b3d" />
      <rect x="2" y="2" width="28" height="18" rx="2" fill="#263335" />
      <rect x="33" y="2" width="28" height="18" rx="2" fill="#263335" />
      <rect x="64" y="2" width="28" height="18" rx="2" fill="#263335" />
      <rect x="95" y="2" width="26" height="18" rx="2" fill="#D6FF64" opacity="0.3" />
      <text x="10" y="15" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="9">FMA PIPELINE</text>
    </g>

    <!-- FMA Operation Box -->
    <g transform="translate(16, 114)">
      <rect width="123" height="44" rx="3" fill="#1e2726" stroke="#D6FF64" stroke-width="1.2" />
      <text x="10" y="18" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">_mm256_fmadd_ps</text>
      <text x="10" y="34" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Accumulate 8 FLOPS/cyc</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M380 165 H415" stroke="#D6FF64" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="415,165 410,161 410,169" fill="#D6FF64" />

  <!-- Section 3: Performance Result (Right Block) -->
  <g transform="translate(425, 75)">
    <rect width="145" height="180" rx="6" fill="#161c1d" stroke="#2e3a3c" />
    <text x="14" y="26" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">BENCHMARK</text>
    <text x="14" y="42" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="10">Latency vs OpenCV</text>

    <!-- Mini Benchmark Representation -->
    <text x="14" y="70" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">OpenCV: 684 µs</text>
    <rect x="14" y="76" width="117" height="12" rx="2" fill="#2d3738" stroke="#3d4c4e" />

    <text x="14" y="106" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">FastCode: 539 µs</text>
    <rect x="14" y="112" width="92" height="12" rx="2" fill="url(#accGrad)" />

    <!-- Gain Callout -->
    <g transform="translate(14, 134)">
      <rect width="117" height="24" rx="3" fill="#1a2522" stroke="#486321" />
      <text x="8" y="16" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">▼ 21% · ~91% PEAK</text>
    </g>
  </g>

  <!-- Footer Legend -->
  <text x="30" y="300" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="10">Single-Core Benchmark · Primary Workload Verification</text>
  <text x="570" y="300" fill="#565F60" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">C++ / AVX2 / FMA</text>
</svg>
