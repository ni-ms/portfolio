<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" role="img" aria-label="Langmetric Model Trace Analytics Pipeline Architecture">
  <defs>
    <linearGradient id="langGradDark" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141919" />
      <stop offset="100%" stop-color="#101414" />
    </linearGradient>
    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6FF64" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D6FF64" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
    .bg-panel { fill: url(#langGradDark); stroke: #232C2D; }
    .grid-line { stroke: #232C2D; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .card-box { fill: #171E1F; stroke: #2E3A3C; }
    .sub-box { fill: #1E2728; stroke: #364446; }
    .header-text { fill: #F2F1EA; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; }
    .label-text { fill: #A5ABAA; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
    .accent-text { fill: #D6FF64; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .accent-line { stroke: #D6FF64; stroke-width: 2; }

    @media (prefers-color-scheme: light) {
      .bg-panel { fill: #EBECE5; stroke: #C8CDC4; }
      .grid-line { stroke: #D2D6CE; }
      .card-box { fill: #FFFFFF; stroke: #C8CDC4; }
      .sub-box { fill: #F2F1EA; stroke: #C8CDC4; }
      .header-text { fill: #101414; }
      .label-text { fill: #454F50; }
      .accent-text { fill: #101414; }
      .accent-line { stroke: #101414; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="600" height="340" rx="8" class="bg-panel" stroke-width="1.5" />

  <!-- Blueprint Grid -->
  <g class="grid-line">
    <line x1="30" y1="60" x2="570" y2="60" />
    <line x1="30" y1="180" x2="570" y2="180" />
    <line x1="170" y1="30" x2="170" y2="310" />
    <line x1="360" y1="30" x2="360" y2="310" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(30, 24)">
    <rect width="190" height="24" rx="4" class="card-box" />
    <circle cx="14" cy="12" r="4" fill="#D6FF64" />
    <text x="26" y="16" class="accent-text" font-size="10" letter-spacing="0.08em">TRACE TELEMETRY SERVICE</text>
  </g>
  <text x="570" y="40" class="label-text" text-anchor="end">RUST / LOCO RS / SEAORM</text>

  <!-- Column 1: Model Traces Ingest (Left) -->
  <g transform="translate(30, 75)">
    <rect width="125" height="185" rx="6" class="card-box" />
    <text x="14" y="24" class="header-text" font-size="12">MODEL TRACES</text>
    <text x="14" y="38" class="label-text">Structured Ingest</text>

    <!-- Trace items -->
    <rect x="14" y="52" width="97" height="32" rx="3" class="sub-box" />
    <circle cx="24" cy="68" r="3" fill="#D6FF64" />
    <text x="34" y="72" class="label-text">span: request</text>

    <rect x="14" y="92" width="97" height="32" rx="3" class="sub-box" />
    <circle cx="24" cy="108" r="3" fill="#D6FF64" />
    <text x="34" y="112" class="label-text">tokens: in/out</text>

    <rect x="14" y="132" width="97" height="32" rx="3" class="sub-box" />
    <circle cx="24" cy="148" r="3" fill="#D6FF64" />
    <text x="34" y="152" class="label-text">latency: ms/cost</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M155 167 H195" class="accent-line" stroke-dasharray="4 3" />
  <polygon points="195,167 188,163 188,171" fill="#D6FF64" />

  <!-- Column 2: Rust Aggregation Engine (Center) -->
  <g transform="translate(195, 75)">
    <rect width="150" height="185" rx="6" class="card-box" />
    <text x="14" y="24" class="header-text" font-size="12">RUST SERVICE</text>
    <text x="14" y="38" class="label-text">Loco RS Framework</text>

    <!-- Async processing layers -->
    <rect x="14" y="52" width="122" height="36" rx="3" class="sub-box" />
    <text x="18" y="70" class="accent-text" font-size="10">Async SeaORM</text>
    <text x="18" y="82" class="label-text" font-size="8">Concurrent Queries</text>

    <rect x="14" y="96" width="122" height="36" rx="3" class="sub-box" />
    <text x="18" y="114" class="header-text" font-size="10">Serde JSON Views</text>
    <text x="18" y="126" class="label-text" font-size="8">Typed Serialization</text>

    <rect x="14" y="140" width="122" height="26" rx="3" fill="#D6FF64" opacity="0.15" stroke="#D6FF64" />
    <text x="18" y="157" class="accent-text" font-size="9">Aggregated Rollups</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M345 167 H385" class="accent-line" stroke-dasharray="4 3" />
  <polygon points="385,167 378,163 378,171" fill="#D6FF64" />

  <!-- Column 3: Operational Dashboards (Right) -->
  <g transform="translate(385, 75)">
    <rect width="185" height="185" rx="6" class="card-box" />
    <text x="14" y="24" class="header-text" font-size="12">DASHBOARDS</text>
    <text x="14" y="38" class="label-text">Chart Visualizations</text>

    <!-- Visual Latency Curve Graphic -->
    <g transform="translate(14, 48)">
      <rect width="157" height="68" rx="3" class="sub-box" />
      <path d="M10 52 Q 30 46, 50 20 T 90 30 T 130 16 L 147 20 L 147 56 L 10 56 Z" fill="url(#curveFill)" />
      <path d="M10 52 Q 30 46, 50 20 T 90 30 T 130 16 L 147 20" class="accent-line" stroke-width="1.6" fill="none" />
      <text x="14" y="16" class="label-text" font-size="8">Latency Distributions</text>
    </g>

    <!-- Measures Pill Row -->
    <g transform="translate(14, 126)">
      <rect width="74" height="24" rx="2" class="sub-box" />
      <text x="8" y="16" class="label-text" font-size="9">Token Usage</text>

      <rect x="80" width="77" height="24" rx="2" class="sub-box" />
      <text x="88" y="16" class="accent-text" font-size="9">Cost Metrics</text>
    </g>
  </g>

  <!-- Footer Legend -->
  <text x="30" y="300" class="label-text">Model Trace Aggregation · Real-Time Operational Dashboards</text>
  <text x="570" y="300" class="label-text" text-anchor="end">Rust / Loco RS / SeaORM</text>
</svg>
