<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" role="img" aria-label="Langmetric Model Trace Analytics Pipeline Diagram">
  <defs>
    <linearGradient id="langBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#141919" />
      <stop offset="100%" stopColor="#101414" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#D6FF64" stop-opacity="0.7" />
      <stop offset="100%" stopColor="#D6FF64" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="340" rx="8" fill="url(#langBg)" stroke="#232C2D" stroke-width="1.5" />

  <!-- Blueprint Grid -->
  <g stroke="#232C2D" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="30" y1="60" x2="570" y2="60" />
    <line x1="30" y1="180" x2="570" y2="180" />
    <line x1="170" y1="30" x2="170" y2="310" />
    <line x1="360" y1="30" x2="360" y2="310" />
  </g>

  <!-- Header / Badge -->
  <rect x="30" y="24" width="190" height="24" rx="4" fill="#1b2223" stroke="#2e3a3c" />
  <circle cx="44" cy="36" r="4" fill="#D6FF64" />
  <text x="56" y="40" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.08em">TELEMETRY / ANALYTICS</text>

  <text x="570" y="40" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">RUST / LOCO RS / SEAORM</text>

  <!-- Column 1: Model Traces Ingest (Left) -->
  <g transform="translate(30, 75)">
    <rect width="125" height="180" rx="6" fill="#161c1d" stroke="#2e3a3c" />
    <text x="14" y="24" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">MODEL TRACES</text>
    <text x="14" y="38" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Structured JSON Ingest</text>

    <!-- Trace items -->
    <rect x="14" y="52" width="97" height="30" rx="3" fill="#1f2829" stroke="#364446" />
    <circle cx="26" cy="67" r="3" fill="#D6FF64" />
    <text x="36" y="70" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="9">span: llm_call</text>

    <rect x="14" y="88" width="97" height="30" rx="3" fill="#1f2829" stroke="#364446" />
    <circle cx="26" cy="103" r="3" fill="#D6FF64" />
    <text x="36" y="106" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="9">tokens: prompt/out</text>

    <rect x="14" y="124" width="97" height="30" rx="3" fill="#1f2829" stroke="#364446" />
    <circle cx="26" cy="139" r="3" fill="#D6FF64" />
    <text x="36" y="142" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="9">latency: ms/cost</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M155 165 H190" stroke="#D6FF64" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="190,165 185,161 185,169" fill="#D6FF64" />

  <!-- Column 2: Rust Aggregation Engine (Center) -->
  <g transform="translate(195, 75)">
    <rect width="150" height="180" rx="6" fill="#161c1d" stroke="#2e3a3c" />
    <text x="14" y="24" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">RUST SERVICE</text>
    <text x="14" y="38" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Loco RS Framework</text>

    <!-- Async processing layers -->
    <rect x="14" y="52" width="122" height="34" rx="3" fill="#1f2829" stroke="#364446" />
    <text x="22" y="68" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Async SeaORM</text>
    <text x="22" y="80" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="8">Concurrent DB Queries</text>

    <rect x="14" y="94" width="122" height="34" rx="3" fill="#1f2829" stroke="#364446" />
    <text x="22" y="110" fill="#F2F1EA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Serde JSON Views</text>
    <text x="22" y="122" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="8">Typed Serialization</text>

    <rect x="14" y="136" width="122" height="26" rx="3" fill="#24302d" stroke="#395231" />
    <text x="22" y="152" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">Rollup Aggregations</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M345 165 H380" stroke="#D6FF64" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="380,165 375,161 375,169" fill="#D6FF64" />

  <!-- Column 3: Operational Dashboards (Right) -->
  <g transform="translate(385, 75)">
    <rect width="185" height="180" rx="6" fill="#161c1d" stroke="#2e3a3c" />
    <text x="14" y="24" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">DASHBOARDS</text>
    <text x="14" y="38" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Chart.js Visualizations</text>

    <!-- Visual Latency Curve Graphic -->
    <g transform="translate(14, 48)">
      <rect width="157" height="66" rx="3" fill="#111617" stroke="#2e3b3d" />
      <!-- Area curve -->
      <path d="M10 50 Q 30 45, 50 20 T 90 28 T 130 15 L 147 18 L 147 54 L 10 54 Z" fill="url(#chartGrad)" />
      <path d="M10 50 Q 30 45, 50 20 T 90 28 T 130 15 L 147 18" stroke="#D6FF64" stroke-width="1.8" fill="none" />
      <text x="14" y="16" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="8">Latency Distributions</text>
    </g>

    <!-- Measures Pill Row -->
    <g transform="translate(14, 122)">
      <rect width="74" height="24" rx="2" fill="#1f2829" stroke="#364446" />
      <text x="8" y="16" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="9">Token Usage</text>

      <rect x="80" width="77" height="24" rx="2" fill="#1f2829" stroke="#364446" />
      <text x="88" y="16" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="9">Cost Metrics</text>
    </g>
    
    <text x="14" y="165" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Real-time Operational Metrics</text>
  </g>

  <!-- Footer Legend -->
  <text x="30" y="300" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="10">Aggregates model traces into operational dashboards</text>
  <text x="570" y="300" fill="#565F60" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">Rust / Loco RS / SeaORM</text>
</svg>
