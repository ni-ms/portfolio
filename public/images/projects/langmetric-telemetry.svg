<svg viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .canvas-bg { fill: #101414; }
      .grid-line { stroke: #2a3536; stroke-width: 1; stroke-dasharray: 4 4; }
      .axis-line { stroke: #3f4e50; stroke-width: 1.5; }
      .curve-area { fill: url(#telemetryAreaGrad); }
      .curve-line { stroke: #D6FF64; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .secondary-curve { stroke: #6b7a7c; stroke-width: 1.5; stroke-dasharray: 6 3; }
      .bar-fill { fill: #243032; stroke: #394749; stroke-width: 1; }
      .bar-accent { fill: #D6FF64; fill-opacity: 0.85; stroke: #D6FF64; stroke-width: 1; }
      .peak-dot { fill: #D6FF64; stroke: #101414; stroke-width: 2; }
      @media (prefers-color-scheme: light) {
        .canvas-bg { fill: #f2f1ea; }
        .grid-line { stroke: #c8cdc0; }
        .axis-line { stroke: #a4ab98; }
        .curve-area { fill: url(#telemetryAreaLight); }
        .curve-line { stroke: #101414; stroke-width: 2.5; }
        .secondary-curve { stroke: #828a76; }
        .bar-fill { fill: #dfe3d6; stroke: #b6baa8; }
        .bar-accent { fill: #D6FF64; stroke: #101414; stroke-width: 1.5; fill-opacity: 1; }
        .peak-dot { fill: #D6FF64; stroke: #101414; stroke-width: 2; }
      }
    </style>
    <linearGradient id="telemetryAreaGrad" x1="0" y1="100" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6FF64" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D6FF64" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="telemetryAreaLight" x1="0" y1="100" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6FF64" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D6FF64" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  {/* Background frame */}
  <rect x="20" y="20" width="560" height="320" rx="12" class="canvas-bg" />
  <rect x="20" y="20" width="560" height="320" rx="12" stroke="#2a3536" stroke-width="1.5" />

  {/* Grid Lines */}
  <g class="chart-grid">
    <line x1="60" y1="80" x2="540" y2="80" class="grid-line" />
    <line x1="60" y1="140" x2="540" y2="140" class="grid-line" />
    <line x1="60" y1="200" x2="540" y2="200" class="grid-line" />
    <line x1="60" y1="260" x2="540" y2="260" class="grid-line" />

    <line x1="120" y1="60" x2="120" y2="280" class="grid-line" />
    <line x1="200" y1="60" x2="200" y2="280" class="grid-line" />
    <line x1="280" y1="60" x2="280" y2="280" class="grid-line" />
    <line x1="360" y1="60" x2="360" y2="280" class="grid-line" />
    <line x1="440" y1="60" x2="440" y2="280" class="grid-line" />
    <line x1="520" y1="60" x2="520" y2="280" class="grid-line" />

    {/* Axes */}
    <line x1="60" y1="280" x2="540" y2="280" class="axis-line" />
    <line x1="60" y1="60" x2="60" y2="280" class="axis-line" />
  </g>

  {/* Histogram Bars along Timeline */}
  <g class="histogram-bars">
    <rect x="80" y="230" width="16" height="50" rx="2" class="bar-fill" />
    <rect x="110" y="210" width="16" height="70" rx="2" class="bar-fill" />
    <rect x="140" y="180" width="16" height="100" rx="2" class="bar-fill" />
    <rect x="170" y="150" width="16" height="130" rx="2" class="bar-fill" />
    <rect x="200" y="120" width="16" height="160" rx="2" class="bar-accent" />
    <rect x="230" y="140" width="16" height="140" rx="2" class="bar-fill" />
    <rect x="260" y="170" width="16" height="110" rx="2" class="bar-fill" />
    <rect x="290" y="200" width="16" height="80" rx="2" class="bar-fill" />
    <rect x="320" y="220" width="16" height="60" rx="2" class="bar-fill" />
    <rect x="350" y="190" width="16" height="90" rx="2" class="bar-fill" />
    <rect x="380" y="160" width="16" height="120" rx="2" class="bar-fill" />
    <rect x="410" y="110" width="16" height="170" rx="2" class="bar-accent" />
    <rect x="440" y="130" width="16" height="150" rx="2" class="bar-fill" />
    <rect x="470" y="170" width="16" height="110" rx="2" class="bar-fill" />
    <rect x="500" y="220" width="16" height="60" rx="2" class="bar-fill" />
  </g>

  {/* Smooth Distribution Area Gradient */}
  <path
    d="M 60 280
       C 100 280, 140 230, 180 140
       C 200 95, 230 110, 270 190
       C 310 270, 360 210, 400 120
       C 430 70, 460 110, 490 200
       C 515 260, 530 280, 540 280
       Z"
    class="curve-area"
  />

  {/* Main Telemetry Distribution Curve */}
  <path
    d="M 60 280
       C 100 280, 140 230, 180 140
       C 200 95, 230 110, 270 190
       C 310 270, 360 210, 400 120
       C 430 70, 460 110, 490 200
       C 515 260, 530 280, 540 280"
    class="curve-line"
  />

  {/* Secondary Comparison Curve (Latency baseline / quantile) */}
  <path
    d="M 60 260
       C 120 250, 180 200, 240 180
       C 300 160, 360 190, 420 150
       C 470 120, 500 160, 540 170"
    class="secondary-curve"
  />

  {/* Key Quantile Peak Dots */}
  <circle cx="205" cy="100" r="5" class="peak-dot" />
  <circle cx="410" cy="85" r="5" class="peak-dot" />
  <circle cx="270" cy="190" r="4" class="peak-dot" />
</svg>
