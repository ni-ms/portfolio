<svg viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .canvas-bg { fill: #101414; }
      .doc-base { fill: #171d1e; stroke: #2a3536; }
      .doc-top { fill: #1c2425; stroke: #3f4e50; }
      .doc-line { stroke: #364446; stroke-width: 2; stroke-linecap: round; }
      .doc-accent-line { stroke: #D6FF64; stroke-width: 2; stroke-linecap: round; }
      .node-wire { stroke: #455456; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .node-wire-active { stroke: #D6FF64; stroke-width: 2; }
      .node-circle { fill: #1c2425; stroke: #D6FF64; stroke-width: 2; }
      .node-circle-subtle { fill: #171d1e; stroke: #3f4e50; stroke-width: 1.5; }
      .fusion-core { fill: #1f2a2c; stroke: #D6FF64; stroke-width: 2; }
      .res-card { fill: #171d1e; stroke: #D6FF64; stroke-width: 2; }
      @media (prefers-color-scheme: light) {
        .canvas-bg { fill: #f2f1ea; }
        .doc-base { fill: #e2e4dc; stroke: #c4c8bc; }
        .doc-top { fill: #ebece4; stroke: #b6baa8; }
        .doc-line { stroke: #b2b8a6; }
        .doc-accent-line { stroke: #101414; }
        .node-wire { stroke: #9ca38e; }
        .node-wire-active { stroke: #101414; stroke-width: 2; }
        .node-circle { fill: #ffffff; stroke: #101414; stroke-width: 2; }
        .node-circle-subtle { fill: #e2e4dc; stroke: #b2b8a6; }
        .fusion-core { fill: #D6FF64; stroke: #101414; stroke-width: 2; }
        .res-card { fill: #ffffff; stroke: #101414; stroke-width: 2; }
      }
    </style>
    <linearGradient id="scottyGrad" x1="0" y1="0" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6FF64" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#D6FF64" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  {/* Background card frame */}
  <rect x="20" y="20" width="560" height="320" rx="12" class="canvas-bg" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="url(#scottyGrad)" stroke="#2a3536" stroke-width="1.5" />

  {/* 1. Left: Corpus Document Stack */}
  <g class="doc-stack">
    {/* Back Doc 3 */}
    <rect x="50" y="70" width="110" height="150" rx="6" class="doc-base" />
    {/* Mid Doc 2 */}
    <rect x="65" y="85" width="110" height="150" rx="6" class="doc-base" />
    {/* Front Doc 1 */}
    <rect x="80" y="100" width="120" height="160" rx="6" class="doc-top" stroke-width="2" />
    {/* Stylized Document lines (text-free abstraction) */}
    <line x1="100" y1="125" x2="140" y2="125" class="doc-accent-line" stroke-width="3" />
    <line x1="100" y1="145" x2="180" y2="145" class="doc-line" />
    <line x1="100" y1="160" x2="170" y2="160" class="doc-line" />
    <line x1="100" y1="175" x2="180" y2="175" class="doc-line" />
    <line x1="100" y1="190" x2="155" y2="190" class="doc-line" />
    <line x1="100" y1="210" x2="175" y2="210" class="doc-line" />
    <line x1="100" y1="225" x2="160" y2="225" class="doc-line" />
    <circle cx="170" cy="125" r="4" fill="#D6FF64" />
  </g>

  {/* 2. Middle Pathways: Top Pathway (Lexical Graph) and Bottom Pathway (Dense Embeddings Cluster) */}
  {/* Pathways departing from document */}
  <path d="M 200 145 C 240 145, 250 100, 290 100" class="node-wire-active" />
  <path d="M 200 215 C 240 215, 250 250, 290 250" class="node-wire-active" />

  {/* Top Lexical Pathway Nodes */}
  <g class="lexical-nodes">
    <path d="M 290 100 L 340 70" class="node-wire" />
    <path d="M 290 100 L 350 125" class="node-wire" />
    <path d="M 340 70 L 400 95" class="node-wire-active" />
    <path d="M 350 125 L 400 95" class="node-wire" />

    <circle cx="290" cy="100" r="7" class="node-circle" />
    <circle cx="340" cy="70" r="6" class="node-circle-subtle" />
    <circle cx="350" cy="125" r="6" class="node-circle-subtle" />
    <circle cx="400" cy="95" r="8" class="node-circle" />
    <circle cx="400" cy="95" r="3" fill="#D6FF64" />
  </g>

  {/* Bottom Dense Embedding Space */}
  <g class="dense-space">
    <path d="M 290 250 L 335 220" class="node-wire" />
    <path d="M 290 250 L 345 275" class="node-wire" />
    <path d="M 335 220 L 400 240" class="node-wire-active" />
    <path d="M 345 275 L 400 240" class="node-wire" />

    {/* Clustered Embedding Nodes */}
    <circle cx="290" cy="250" r="7" class="node-circle" />
    <circle cx="320" cy="270" r="4" class="node-circle-subtle" />
    <circle cx="335" cy="220" r="6" class="node-circle-subtle" />
    <circle cx="345" cy="275" r="5" class="node-circle-subtle" />
    <circle cx="365" cy="245" r="4" class="node-circle-subtle" />
    <circle cx="400" cy="240" r="8" class="node-circle" />
    <circle cx="400" cy="240" r="3" fill="#D6FF64" />
  </g>

  {/* 3. Convergence into Fusion Core */}
  <path d="M 400 95 C 430 95, 430 150, 450 170" class="node-wire-active" />
  <path d="M 400 240 C 430 240, 430 190, 450 170" class="node-wire-active" />

  {/* Fusion Core Prism */}
  <polygon points="450,150 475,170 450,190 425,170" class="fusion-core" />
  <circle cx="450" cy="170" r="4" fill="#D6FF64" />

  {/* 4. Output Ranked Document Card */}
  <path d="M 475 170 L 500 170" class="node-wire-active" />
  <rect x="500" y="115" width="70" height="110" rx="6" class="res-card" />
  <rect x="500" y="115" width="70" height="18" rx="6" fill="#D6FF64" />
  <line x1="510" y1="145" x2="555" y2="145" class="doc-accent-line" stroke-width="2.5" />
  <line x1="510" y1="160" x2="550" y2="160" class="doc-line" />
  <line x1="510" y1="175" x2="555" y2="175" class="doc-line" />
  <line x1="510" y1="190" x2="540" y2="190" class="doc-line" />
</svg>
