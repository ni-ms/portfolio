<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" role="img" aria-label="ScottyPi Hybrid Retrieval Pipeline Diagram">
  <defs>
    <linearGradient id="scottyBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#141919" />
      <stop offset="100%" stopColor="#101414" />
    </linearGradient>
    <linearGradient id="scottyAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#D6FF64" />
      <stop offset="100%" stopColor="#a3d629" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="340" rx="8" fill="url(#scottyBg)" stroke="#232C2D" stroke-width="1.5" />

  <!-- Blueprint Grid -->
  <g stroke="#232C2D" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="30" y1="60" x2="570" y2="60" />
    <line x1="30" y1="185" x2="570" y2="185" />
    <line x1="165" y1="30" x2="165" y2="310" />
    <line x1="395" y1="30" x2="395" y2="310" />
  </g>

  <!-- Header / Badge -->
  <rect x="30" y="24" width="180" height="24" rx="4" fill="#1b2223" stroke="#2e3a3c" />
  <circle cx="44" cy="36" r="4" fill="#D6FF64" />
  <text x="56" y="40" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.08em">HYBRID RETRIEVAL / RAG</text>

  <text x="570" y="40" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">CMU-SV CAMPUS DATASET</text>

  <!-- Column 1: Knowledge Corpus (Left) -->
  <g transform="translate(30, 75)">
    <rect width="125" height="180" rx="6" fill="#161c1d" stroke="#2e3a3c" />
    <text x="14" y="24" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">CORPUS</text>
    <text x="14" y="38" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">CMU-SV Ingest</text>

    <!-- Source Page Cards -->
    <rect x="14" y="52" width="97" height="36" rx="3" fill="#1f2829" stroke="#364446" />
    <text x="22" y="68" fill="#D6FF64" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">20</text>
    <text x="48" y="66" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="9">Official</text>
    <text x="48" y="78" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="8">Web Pages</text>

    <rect x="14" y="98" width="97" height="36" rx="3" fill="#1f2829" stroke="#364446" />
    <text x="22" y="114" fill="#D6FF64" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">133</text>
    <text x="56" y="112" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="9">Passages</text>
    <text x="56" y="124" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="8">Chunked</text>

    <rect x="14" y="144" width="97" height="22" rx="3" fill="#1c2425" stroke="#2c3739" />
    <text x="20" y="158" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Preprocessed</text>
  </g>

  <!-- Split paths to BM25 and Dense -->
  <path d="M155 125 H180 V105 H200" stroke="#D6FF64" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M155 125 H180 V205 H200" stroke="#D6FF64" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Column 2: Dual Hybrid Retrieval (Center) -->
  <g transform="translate(200, 75)">
    <!-- Branch A: BM25 Lexical Search -->
    <rect x="0" y="0" width="170" height="72" rx="5" fill="#161c1d" stroke="#2e3a3c" />
    <text x="12" y="20" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">BM25 KEYWORD SEARCH</text>
    <text x="12" y="34" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Exact Token Frequency Scoring</text>
    <rect x="12" y="44" width="146" height="18" rx="2" fill="#202a2c" />
    <text x="18" y="56" fill="#C8CAC7" font-family="'JetBrains Mono', monospace" font-size="9">Lexical Inverted Index</text>

    <!-- Branch B: Dense MiniLM Embeddings -->
    <rect x="0" y="98" width="170" height="82" rx="5" fill="#161c1d" stroke="#2e3a3c" />
    <text x="12" y="118" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">DENSE VECTOR SEARCH</text>
    <text x="12" y="132" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Fine-Tuned MiniLM / QLoRA</text>
    <rect x="12" y="142" width="146" height="26" rx="2" fill="#1f2b26" stroke="#375225" />
    <text x="18" y="159" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">Semantic Cosine Alignment</text>
  </g>

  <!-- Connectors into RRF -->
  <path d="M370 110 H385 V155 H405" stroke="#D6FF64" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M370 215 H385 V175 H405" stroke="#D6FF64" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Column 3: Fusion & Evaluation (Right) -->
  <g transform="translate(405, 75)">
    <rect width="165" height="180" rx="6" fill="#161c1d" stroke="#2e3a3c" />
    <text x="14" y="24" fill="#F2F1EA" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">RRF FUSION &amp; EVAL</text>
    <text x="14" y="38" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Reciprocal-Rank Score</text>

    <!-- RRF Block -->
    <rect x="14" y="50" width="137" height="34" rx="3" fill="#1f2829" stroke="#364446" />
    <text x="22" y="66" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">score(d) = Σ 1/(k + r)</text>
    <text x="22" y="77" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="8">Merged Ranking</text>

    <!-- Evaluation Block -->
    <rect x="14" y="94" width="137" height="74" rx="3" fill="#1c2425" stroke="#2e3b3d" />
    <text x="20" y="110" fill="#F2F1EA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">160 Questions</text>
    <text x="20" y="124" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="9">Train / Dev / Test</text>
    
    <g transform="translate(20, 134)">
      <rect width="40" height="18" rx="2" fill="#243033" />
      <text x="4" y="13" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="8">R@1</text>
      <rect x="44" y="0" width="40" height="18" rx="2" fill="#243033" />
      <text x="48" y="13" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="8">R@3</text>
      <rect x="88" y="0" width="37" height="18" rx="2" fill="#243033" />
      <text x="94" y="13" fill="#D6FF64" font-family="'JetBrains Mono', monospace" font-size="8">MRR</text>
    </g>
  </g>

  <!-- Footer Legend -->
  <text x="30" y="300" fill="#8E9596" font-family="'JetBrains Mono', monospace" font-size="10">Evaluation on official CMU-SV pages · No fabricated metric scores</text>
  <text x="570" y="300" fill="#565F60" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">Python / MiniLM / QLoRA</text>
</svg>
