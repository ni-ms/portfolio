<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" role="img" aria-label="ScottyPi Hybrid Retrieval Architecture">
  <defs>
    <linearGradient id="scottyGradDark" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141919" />
      <stop offset="100%" stop-color="#101414" />
    </linearGradient>
  </defs>

  <style>
    .bg-panel { fill: url(#scottyGradDark); stroke: #232C2D; }
    .grid-line { stroke: #232C2D; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .card-box { fill: #171E1F; stroke: #2E3A3C; }
    .sub-box { fill: #1E2728; stroke: #364446; }
    .header-text { fill: #F2F1EA; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; }
    .label-text { fill: #A5ABAA; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
    .accent-text { fill: #D6FF64; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .accent-line { stroke: #D6FF64; stroke-width: 2; }

    @media (prefers-color-scheme: light) {
      .bg-panel { fill: #EBECE5; stroke: #C8CDC4; }
      .grid-line { stroke: #D2D6CE; }
      .card-box { fill: #FFFFFF; stroke: #C8CDC4; }
      .sub-box { fill: #F2F1EA; stroke: #C8CDC4; }
      .header-text { fill: #101414; }
      .label-text { fill: #454F50; }
      .accent-text { fill: #101414; }
      .accent-line { stroke: #101414; }
    }
  </style>

  <!-- Background -->
  <rect width="600" height="340" rx="8" class="bg-panel" stroke-width="1.5" />

  <!-- Grid Blueprint -->
  <g class="grid-line">
    <line x1="30" y1="60" x2="570" y2="60" />
    <line x1="30" y1="185" x2="570" y2="185" />
    <line x1="165" y1="30" x2="165" y2="310" />
    <line x1="395" y1="30" x2="395" y2="310" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(30, 24)">
    <rect width="180" height="24" rx="4" class="card-box" />
    <circle cx="14" cy="12" r="4" fill="#D6FF64" />
    <text x="26" y="16" class="accent-text" font-size="10" letter-spacing="0.08em">RETRIEVAL PIPELINE</text>
  </g>
  <text x="570" y="40" class="label-text" text-anchor="end">CMU-SV CAMPUS DATASET</text>

  <!-- Column 1: Corpus (Left) -->
  <g transform="translate(30, 75)">
    <rect width="125" height="185" rx="6" class="card-box" />
    <text x="14" y="24" class="header-text" font-size="12">CORPUS</text>
    <text x="14" y="38" class="label-text">Official Pages</text>

    <rect x="14" y="52" width="97" height="40" rx="3" class="sub-box" />
    <text x="20" y="72" class="accent-text" font-size="16">20</text>
    <text x="46" y="70" class="label-text">Official</text>
    <text x="46" y="82" class="label-text" font-size="8">Web Pages</text>

    <rect x="14" y="102" width="97" height="40" rx="3" class="sub-box" />
    <text x="20" y="122" class="accent-text" font-size="16">133</text>
    <text x="54" y="120" class="label-text">Passages</text>
    <text x="54" y="132" class="label-text" font-size="8">Indexed</text>

    <rect x="14" y="150" width="97" height="22" rx="3" class="sub-box" />
    <text x="20" y="165" class="label-text" font-size="9">Structured Splits</text>
  </g>

  <!-- Split arrows -->
  <path d="M155 125 H180 V105 H200" class="accent-line" stroke-dasharray="3 3" />
  <path d="M155 125 H180 V205 H200" class="accent-line" stroke-dasharray="3 3" />

  <!-- Column 2: Dual Hybrid Retrieval (Center) -->
  <g transform="translate(200, 75)">
    <!-- Branch A: BM25 Lexical Search -->
    <rect x="0" y="0" width="170" height="74" rx="5" class="card-box" />
    <text x="12" y="22" class="header-text" font-size="11">BM25 KEYWORD SEARCH</text>
    <text x="12" y="38" class="label-text">Lexical Frequency Scoring</text>
    <rect x="12" y="46" width="146" height="20" rx="2" class="sub-box" />
    <text x="18" y="60" class="label-text">Inverted Index</text>

    <!-- Branch B: Dense MiniLM Embeddings -->
    <rect x="0" y="98" width="170" height="87" rx="5" class="card-box" />
    <text x="12" y="120" class="header-text" font-size="11">DENSE VECTOR SEARCH</text>
    <text x="12" y="136" class="label-text">Fine-Tuned MiniLM / QLoRA</text>
    <rect x="12" y="146" width="146" height="26" rx="2" class="sub-box" />
    <text x="18" y="163" class="accent-text" font-size="9">Semantic Alignment</text>
  </g>

  <!-- Connectors into RRF -->
  <path d="M370 110 H385 V155 H405" class="accent-line" stroke-dasharray="3 3" />
  <path d="M370 215 H385 V175 H405" class="accent-line" stroke-dasharray="3 3" />

  <!-- Column 3: Fusion & Evaluation (Right) -->
  <g transform="translate(405, 75)">
    <rect width="165" height="185" rx="6" class="card-box" />
    <text x="14" y="24" class="header-text" font-size="12">RRF &amp; EVALUATION</text>
    <text x="14" y="38" class="label-text">Rank Fusion Formula</text>

    <!-- Formula Box -->
    <rect x="14" y="50" width="137" height="34" rx="3" class="sub-box" />
    <text x="18" y="70" class="accent-text" font-size="10">score = Σ 1/(k + r)</text>

    <!-- Evaluation Box -->
    <rect x="14" y="94" width="137" height="78" rx="3" class="sub-box" />
    <text x="16" y="112" class="header-text" font-size="10">160 Questions</text>
    <text x="16" y="126" class="label-text">Train / Dev / Test Splits</text>

    <g transform="translate(16, 138)">
      <rect width="36" height="20" rx="2" fill="#D6FF64" opacity="0.2" />
      <text x="6" y="14" class="accent-text" font-size="8">R@1</text>

      <rect x="40" width="36" height="20" rx="2" fill="#D6FF64" opacity="0.2" />
      <text x="46" y="14" class="accent-text" font-size="8">R@3</text>

      <rect x="80" width="36" height="20" rx="2" fill="#D6FF64" opacity="0.2" />
      <text x="86" y="14" class="accent-text" font-size="8">MRR</text>
    </g>
  </g>

  <!-- Footer Legend -->
  <text x="30" y="300" class="label-text">Campus Retrieval Assistant · Hybrid Search &amp; Reciprocal-Rank Fusion</text>
  <text x="570" y="300" class="label-text" text-anchor="end">Python / MiniLM / QLoRA</text>
</svg>
